version: '3.8'

services:
  # Nginx API Gateway
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./api_gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api_gateway
    networks:
      - ml_insights_network

  feature-service:
    build: ./feature-service
    ports:
      - "8003:8003"
    env_file:
      - .env
    depends_on:
      - db-service

  # API Gateway Service
  api_gateway:
    build:
      context: ./api_gateway
    env_file:
      - .env
    environment:
      - DB_SERVICE_URL=http://db_service:8001
      - QUEUE_SERVICE_URL=http://queue_service:8002
    networks:
      - ml_insights_network

  # Database Service
  db_service:
    build:
      context: ./db_service
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ml_insights
    depends_on:
      - postgres
    networks:
      - ml_insights_network

  # Queue Service
  queue_service:
    build:
      context: ./queue_service
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - rabbitmq
    networks:
      - ml_insights_network

  # Worker Service
  worker_service:
    build:
      context: ./worker_service
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ml_insights
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - rabbitmq
      - postgres
    networks:
      - ml_insights_network

  # PostgreSQL Database
  postgres:
    image: postgres:14
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ml_insights
    networks:
      - ml_insights_network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    networks:
      - ml_insights_network

networks:
  ml_insights_network: